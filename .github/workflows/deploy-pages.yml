name: Deploy landing

on:
  push:
    branches: [main]
    paths:
      - 'vsluh-frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vsluh-frontend/web/package-lock.json

      - name: Install
        working-directory: vsluh-frontend/web
        run: npm ci

      - name: Build
        working-directory: vsluh-frontend/web
        env:
          NUXT_PUBLIC_SITE_URL: https://vsluh.club
          NUXT_PUBLIC_APP_VERSION: ${{ github.sha }}
        run: npm run generate

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: vsluh-frontend/web/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
