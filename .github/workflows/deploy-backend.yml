name: Deploy backend

on:
  push:
    branches: [dev, main]
    paths:
      - 'vsluh-backend/**'
      - 'manifest.yaml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: vsluh-backend/**/go.sum

      - name: Test
        working-directory: vsluh-backend
        run: make test-all

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: SAM build
        run: sam build --template manifest.yaml

      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name "vsluh-${ENVIRONMENT}" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              AppVersion="${GITHUB_SHA}" \
              DeletionProtectionEnabled="${{ vars.DELETION_PROTECTION_ENABLED }}" \
              ThrottlingRateLimit="${{ vars.THROTTLING_RATE_LIMIT }}" \
              ThrottlingBurstLimit="${{ vars.THROTTLING_BURST_LIMIT }}" \
              TelegramBotToken="${{ secrets.TELEGRAM_BOT_TOKEN }}"
