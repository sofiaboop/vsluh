name: Deploy miniapp

on:
  push:
    branches: [dev, main]
    paths:
      - 'vsluh-miniapp/**'
      - '.github/workflows/deploy-miniapp.yml'
  workflow_dispatch:

concurrency:
  group: deploy-miniapp-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vsluh-miniapp/web/package-lock.json

      - name: Install
        working-directory: vsluh-miniapp/web
        run: npm ci

      - name: Build
        working-directory: vsluh-miniapp/web
        env:
          NUXT_PUBLIC_API_URL: ${{ vars.API_URL }}
          NUXT_PUBLIC_BOT_NAME: ${{ vars.BOT_NAME }}
          NUXT_PUBLIC_APP_VERSION: ${{ github.sha }}
        run: npm run generate

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync immutable assets
        working-directory: vsluh-miniapp/web/.output/public
        run: |
          aws s3 sync . "s3://${{ vars.MINIAPP_S3_BUCKET }}" \
            --exclude "*" --include "_nuxt/*" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync html and the rest
        working-directory: vsluh-miniapp/web/.output/public
        run: |
          aws s3 sync . "s3://${{ vars.MINIAPP_S3_BUCKET }}" \
            --exclude "_nuxt/*" \
            --cache-control "no-cache, must-revalidate" \
            --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.MINIAPP_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/" "/index.html" "/200.html" "/404.html"
