name: infra-ci-permissions

# Разовая загрузка: выдаёт `vsluh-ci` права на инвалидацию CloudFront.
# Гоняется из CI, а не локально, потому что у локального `vsluh-deploy`
# отобраны все действия IAM. Запускается только руками.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws/ci-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - run: terraform init -input=false
      - run: terraform apply -input=false -auto-approve
