name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Go lambdas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: vsluh-backend/**/go.sum
      - name: Vet
        working-directory: vsluh-backend
        run: make vet
      - name: Test
        working-directory: vsluh-backend
        run: make test-all

  frontend:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [vsluh-frontend, vsluh-miniapp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/web/package-lock.json
      - name: Install
        working-directory: ${{ matrix.app }}/web
        run: npm ci
      - name: Build
        working-directory: ${{ matrix.app }}/web
        run: npm run generate
