AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ВСЛУХ — REST API (Go Lambda + API Gateway + DynamoDB)

Parameters:
  ProjectName:
    Type: String
    Default: vsluh
  Environment:
    Type: String
    AllowedValues: [dev, prod]
  AppVersion:
    Type: String
    Default: local
  TelegramBotToken:
    Type: String
    NoEcho: true
    Default: ''
  AuthJwtSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Секрет подписи токенов сессии (HS256). Пустое значение отключает вход.
  DashscopeApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Ключ Alibaba Model Studio. Пустое значение отключает разбор речи.
  DashscopeBaseUrl:
    Type: String
    Default: https://dashscope-intl.aliyuncs.com
  DashscopeAsrModel:
    Type: String
    Default: qwen-audio-3.0-asr-flash
  DashscopeLlmModel:
    Type: String
    Default: ''
    Description: Текстовая модель для связного совета. Пусто — разбор остаётся на метриках.
  DeletionProtectionEnabled:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  ThrottlingRateLimit:
    Type: Number
    Default: 50
  ThrottlingBurstLimit:
    Type: Number
    Default: 100

Globals:
  Function:
    Runtime: provided.al2023
    Handler: bootstrap
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        APP_VERSION: !Ref AppVersion
    Tags:
      Product: !Ref ProjectName
      Environment: !Ref Environment

Resources:
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-api'
      StageName: !Ref Environment
      EndpointConfiguration:
        Type: REGIONAL
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Telegram-Init-Data'"
        AllowOrigin: "'*'"
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: !Ref ThrottlingRateLimit
          ThrottlingBurstLimit: !Ref ThrottlingBurstLimit

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-${Environment}-sessions'
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !Ref DeletionProtectionEnabled
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: session_id
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      Tags:
        - Key: Product
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-${Environment}-users'
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !Ref DeletionProtectionEnabled
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      Tags:
        - Key: Product
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  ChecksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-${Environment}-checks'
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !Ref DeletionProtectionEnabled
      AttributeDefinitions:
        - AttributeName: user_email
          AttributeType: S
        - AttributeName: sort_key
          AttributeType: S
      KeySchema:
        - AttributeName: user_email
          KeyType: HASH
        - AttributeName: sort_key
          KeyType: RANGE
      Tags:
        - Key: Product
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # Записи ответов храним бессрочно: история практики — смысл личного кабинета.
  AudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-audio-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET]
            AllowedOrigins: ['*']
            AllowedHeaders: ['*']
            MaxAge: 3000
      Tags:
        - Key: Product
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  QuestionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-${Environment}-questions'
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !Ref DeletionProtectionEnabled
      AttributeDefinitions:
        - AttributeName: topic_id
          AttributeType: S
        - AttributeName: question_id
          AttributeType: S
      KeySchema:
        - AttributeName: topic_id
          KeyType: HASH
        - AttributeName: question_id
          KeyType: RANGE
      Tags:
        - Key: Product
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  EchoFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-echo'
      CodeUri: vsluh-backend/lambdas-go/echo/
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /echo
            Method: GET

  FuncsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-funcs'
      CodeUri: vsluh-backend/lambdas-go/funcs/
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          DYNAMODB_SESSIONS_TABLE_NAME: !Ref SessionsTable
          DYNAMODB_QUESTIONS_TABLE_NAME: !Ref QuestionsTable
          DYNAMODB_USERS_TABLE_NAME: !Ref UsersTable
          DYNAMODB_CHECKS_TABLE_NAME: !Ref ChecksTable
          AUDIO_BUCKET_NAME: !Ref AudioBucket
          TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
          AUTH_JWT_SECRET: !Ref AuthJwtSecret
          DASHSCOPE_API_KEY: !Ref DashscopeApiKey
          DASHSCOPE_BASE_URL: !Ref DashscopeBaseUrl
          DASHSCOPE_ASR_MODEL: !Ref DashscopeAsrModel
          DASHSCOPE_LLM_MODEL: !Ref DashscopeLlmModel
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref QuestionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ChecksTable
        - S3CrudPolicy:
            BucketName: !Ref AudioBucket
      Events:
        Proxy:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: Базовый URL API
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  SessionsTableName:
    Value: !Ref SessionsTable
  QuestionsTableName:
    Value: !Ref QuestionsTable
  UsersTableName:
    Value: !Ref UsersTable
  ChecksTableName:
    Value: !Ref ChecksTable
  AudioBucketName:
    Value: !Ref AudioBucket
