# Несекретные переменные CI. Секреты — только в GitHub Actions Secrets под теми же именами.
# Формат: USER_{BACKEND|FRONTEND|MINIAPP}_{DEV|PROD}_{KEY}

common:
  NODE_VERSION: '22'
  GO_VERSION: '1.24'
  PACKET_MANAGER_TYPE: npm
  AWS_REGION: eu-central-1
  PROJECT_NAME: vsluh

backend:
  USER_BACKEND_DEV_ENVIRONMENT: dev
  USER_BACKEND_DEV_DELETION_PROTECTION_ENABLED: 'false'
  USER_BACKEND_DEV_THROTTLING_RATE_LIMIT: '20'
  USER_BACKEND_DEV_THROTTLING_BURST_LIMIT: '40'
  USER_BACKEND_DEV_TELEGRAM_BOT_TOKEN: '' # секрет, заполняется из GH Secrets
  USER_BACKEND_DEV_AUTH_JWT_SECRET: '' # секрет, заполняется из GH Secrets
  USER_BACKEND_DEV_DASHSCOPE_API_KEY: '' # секрет, заполняется из GH Secrets
  USER_BACKEND_DEV_DASHSCOPE_BASE_URL: https://dashscope-intl.aliyuncs.com
  USER_BACKEND_DEV_DASHSCOPE_ASR_MODEL: qwen-audio-3.0-asr-flash
  # Текстовая модель для связного совета. Пусто — разбор остаётся на метриках.
  USER_BACKEND_DEV_DASHSCOPE_LLM_MODEL: ''

  USER_BACKEND_PROD_ENVIRONMENT: prod
  USER_BACKEND_PROD_DELETION_PROTECTION_ENABLED: 'true'
  USER_BACKEND_PROD_THROTTLING_RATE_LIMIT: '50'
  USER_BACKEND_PROD_THROTTLING_BURST_LIMIT: '100'
  USER_BACKEND_PROD_TELEGRAM_BOT_TOKEN: '' # секрет, заполняется из GH Secrets
  USER_BACKEND_PROD_AUTH_JWT_SECRET: '' # секрет, заполняется из GH Secrets
  USER_BACKEND_PROD_DASHSCOPE_API_KEY: '' # секрет, заполняется из GH Secrets
  USER_BACKEND_PROD_DASHSCOPE_BASE_URL: https://dashscope-intl.aliyuncs.com
  USER_BACKEND_PROD_DASHSCOPE_ASR_MODEL: qwen-audio-3.0-asr-flash
  USER_BACKEND_PROD_DASHSCOPE_LLM_MODEL: ''

frontend:
  USER_FRONTEND_DEV_SITE_URL: https://dev.vsluh.club
  USER_FRONTEND_DEV_API_URL: https://api-dev.vsluh.club
  USER_FRONTEND_DEV_BOT_NAME: vsluh_dev_bot
  USER_FRONTEND_DEV_FEATURE_AUTH: 'true'
  USER_FRONTEND_DEV_FEATURE_ANALYSIS: 'true'

  USER_FRONTEND_PROD_SITE_URL: https://vsluh.club
  USER_FRONTEND_PROD_API_URL: https://api.vsluh.club
  USER_FRONTEND_PROD_BOT_NAME: vsluh_bot
  USER_FRONTEND_PROD_FEATURE_AUTH: 'false'
  USER_FRONTEND_PROD_FEATURE_ANALYSIS: 'false'
